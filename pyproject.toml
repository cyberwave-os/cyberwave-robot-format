[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwave-robot-format"
version = "0.1.16"
description = "Universal robot description schema and format converters for Cyberwave"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cyberwave Team", email = "info@cyberwave.com"},
]
keywords = [
    "robotics",
    "urdf",
    "mjcf",
    "sdf",
    "usd",
    "openusd",
    "robot-description",
    "format-conversion",
]
dependencies = [
    # NOTE: `cyberwave-geometry` is a real runtime dependency of this package's
    # rotation maths and is deliberately NOT declared yet. It is published to no
    # index, so declaring it makes installation fail outright:
    #   ERROR: Could not find a version that satisfies the requirement
    #          cyberwave-geometry<0.2.0,>=0.1.1 (from versions: none)
    # which is what broke the "Build Robot Format prerelease" job.
    #
    # Until it is published, `_geometry.py` imports it lazily, so only the code
    # paths that actually do rotation maths need it at all, and CI installs it
    # from the checkout (.github/actions/setup-geometry-core) for jobs that do.
    #
    # To declare it properly: publish the platform wheels, then add
    #   "cyberwave-geometry>=0.2.0,<0.3.0",
    # back here. See common/geometry/docs/MIGRATION.md.
    "numpy>=1.20.0",
    "lxml>=4.6.0",
    "defusedxml>=0.7.0",
    "trimesh>=3.0.0",
    "pycollada>=0.7.0",
    "resolve-robotics-uri-py>=0.3.0",
    "cattrs>=23.0.0",
]

[project.optional-dependencies]
collision = ["coacd>=1.0.14"]
# OpenUSD Python bindings, required only by cyberwave_robot_format.usd. Kept
# optional so the rest of the package stays installable without them.
# scipy: the convex hull behind the hollow-mesh check (cyberwave_robot_format.collision),
# which reports "unknown" rather than failing when it is missing.
# usd-core publishes no linux/aarch64 wheel (e.g. Docker on Apple Silicon); there
# NVIDIA's usd-exchange wheel ships the same ``pxr`` modules.
usd = [
    "pillow>=10.0.0",
    "scipy>=1.10",
    'usd-core>=24.0; sys_platform != "linux" or platform_machine == "x86_64"',
    'usd-exchange>=3.0; sys_platform == "linux" and platform_machine == "aarch64"',
    # Every other Linux architecture: neither wheel exists, and usd-core ships no
    # sdist. Asking for this extra there must still fail at install time rather
    # than succeeding with no USD at all -- the unmarked requirement does that.
    'usd-core>=24.0; sys_platform == "linux" and platform_machine not in "x86_64 aarch64"',
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10.0",
    "black>=21.0.0",
    "isort>=5.0.0",
    "mypy>=0.800",
    # Pulled into `dev` so CI actually exercises the USD tests rather than skipping
    # them. Same platform split as the `usd` extra above.
    'usd-core>=24.0; sys_platform != "linux" or platform_machine == "x86_64"',
    'usd-exchange>=3.0; sys_platform == "linux" and platform_machine == "aarch64"',
    # Texture handling in the USD scene -> GLB converter; part of the `usd` extra.
    "pillow>=10.0.0",
    # Convex hull for the hollow-mesh check; part of the `usd` extra.
    "scipy>=1.10",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberwave_robot_format*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["cyberwave_robot_format"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=cyberwave_robot_format",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
